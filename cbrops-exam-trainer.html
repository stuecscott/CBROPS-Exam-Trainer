<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CBROPS 200-201 Exam Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --bg-2: #0f1525;
    --panel: rgba(15, 23, 42, 0.5);
    --panel-2: rgba(15, 23, 42, 0.85);
    --border: rgba(51, 65, 85, 0.5);
    --border-bright: rgba(71, 85, 105, 0.8);
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-muted: #64748b;
    --cyan: #22d3ee;
    --purple: #a78bfa;
    --pink: #f472b6;
    --orange: #fb923c;
    --green: #4ade80;
    --emerald: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(34, 211, 238, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34, 211, 238, 0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 25%;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34, 211, 238, 0.15) 0%, transparent 70%);
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .glow-2 {
    position: fixed;
    bottom: 0; right: 25%;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(167, 139, 250, 0.15) 0%, transparent 70%);
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1rem;
    position: relative;
    z-index: 1;
  }
  @media (min-width: 768px) {
    .container { padding: 2rem; }
  }

  /* HEADER */
  header {
    border-bottom: 1px solid rgba(34, 211, 238, 0.2);
    padding-bottom: 1.5rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .logo {
    display: flex; align-items: center; gap: 0.75rem;
  }
  .logo-icon {
    width: 40px; height: 40px;
    border-radius: 4px;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    display: flex; align-items: center; justify-content: center;
    color: #0a0e1a;
  }
  .logo h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .logo h1 .accent { color: var(--cyan); }
  .logo .subtitle {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    margin-top: 0.15rem;
  }
  @media (min-width: 768px) {
    .logo h1 { font-size: 1.875rem; }
  }
  .back-btn {
    font-size: 0.7rem;
    color: var(--cyan);
    border: 1px solid rgba(34, 211, 238, 0.3);
    background: transparent;
    padding: 0.5rem 0.75rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.1em;
    transition: all 0.2s;
  }
  .back-btn:hover {
    border-color: var(--cyan);
    color: #67e8f9;
  }

  /* LABELS */
  .section-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    margin-bottom: 0.75rem;
  }

  /* CARDS */
  .panel {
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    padding: 1.5rem;
  }
  .panel-bright {
    border-color: rgba(34, 211, 238, 0.3);
  }

  /* STATUS BANNER */
  .status-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .status-banner h2 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-top: 0.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .status-info {
    font-size: 0.875rem;
    color: var(--text-dim);
    margin-top: 0.25rem;
  }

  /* MODE CARDS */
  .mode-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  @media (min-width: 768px) {
    .mode-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .mode-card {
    border: 1px solid var(--border);
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.4);
    padding: 1.25rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    color: inherit;
    font-family: inherit;
  }
  .mode-card:hover {
    transform: translateY(-2px);
    background: rgba(15, 23, 42, 0.7);
  }
  .mode-card[data-color="cyan"]:hover { border-color: var(--cyan); }
  .mode-card[data-color="purple"]:hover { border-color: var(--purple); }
  .mode-card[data-color="orange"]:hover { border-color: var(--orange); }
  .mode-card .mode-icon { width: 28px; height: 28px; margin-bottom: 0.75rem; }
  .mode-card[data-color="cyan"] .mode-icon { color: var(--cyan); }
  .mode-card[data-color="purple"] .mode-icon { color: var(--purple); }
  .mode-card[data-color="orange"] .mode-icon { color: var(--orange); }
  .mode-card[data-color="cyan"] .mode-title { color: var(--cyan); }
  .mode-card[data-color="purple"] .mode-title { color: var(--purple); }
  .mode-card[data-color="orange"] .mode-title { color: var(--orange); }
  .mode-card .mode-title {
    font-weight: 700;
    font-size: 1.125rem;
    letter-spacing: 0.05em;
  }
  .mode-card .mode-subtitle {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin: 0.25rem 0 0.75rem;
  }
  .mode-card .mode-desc {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* DOMAIN BREAKDOWN */
  .domain-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.75rem;
  }
  @media (min-width: 768px) {
    .domain-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .domain-card {
    border: 1px solid var(--border);
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.3);
    padding: 1rem;
    transition: border-color 0.2s;
  }
  .domain-card:hover { border-color: var(--border-bright); }
  .domain-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  .domain-card-info { display: flex; align-items: center; gap: 0.75rem; }
  .domain-icon { width: 20px; height: 20px; }
  .domain-name { font-size: 0.875rem; font-weight: 600; }
  .domain-weight { font-size: 0.7rem; color: var(--text-muted); }
  .domain-pct { font-size: 1.125rem; font-weight: 700; text-align: right; }
  .domain-frac { font-size: 0.7rem; color: var(--text-muted); text-align: right; }
  .progress-bar {
    height: 6px;
    background: rgba(30, 41, 59, 0.8);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    transition: width 0.5s ease;
    border-radius: 999px;
  }

  /* BUTTONS */
  .btn {
    border: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.4);
    color: var(--text-dim);
    padding: 0.625rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    transition: all 0.2s;
  }
  .btn:hover {
    border-color: var(--border-bright);
    color: var(--text);
  }
  .btn-primary {
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    color: #0a0e1a;
    font-weight: 700;
    border: none;
    padding: 1rem 1.5rem;
    width: 100%;
    font-size: 0.875rem;
    letter-spacing: 0.15em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .btn-primary:hover {
    background: linear-gradient(90deg, #67e8f9, #c4b5fd);
  }
  .btn-purple {
    border-color: rgba(167, 139, 250, 0.4);
    color: var(--purple);
  }
  .btn-purple:hover {
    border-color: var(--purple);
    color: #c4b5fd;
  }
  .btn-danger {
    border-color: rgba(248, 113, 113, 0.3);
    color: var(--red);
  }
  .btn-danger:hover {
    border-color: var(--red);
    color: #fca5a5;
  }
  .btn-confirm {
    background: var(--red);
    color: #0a0e1a;
    font-weight: 700;
    border: none;
  }

  /* MODE CONFIG */
  .mode-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  .mode-tab {
    padding: 0.875rem;
    font-size: 0.875rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    border: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.3);
    color: var(--text-dim);
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .mode-tab:hover { background: rgba(15, 23, 42, 0.6); }
  .mode-tab.active { background: rgba(30, 41, 59, 0.8); }
  .mode-tab.active[data-mode="study"] { border-color: var(--cyan); color: var(--cyan); }
  .mode-tab.active[data-mode="practice"] { border-color: var(--purple); color: var(--purple); }
  .mode-tab.active[data-mode="exam"] { border-color: var(--orange); color: var(--orange); }

  .config-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
  }
  .domain-tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  @media (min-width: 768px) {
    .domain-tabs { grid-template-columns: repeat(3, 1fr); }
  }
  .domain-tab {
    padding: 0.75rem;
    font-size: 0.7rem;
    border: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.3);
    color: var(--text-dim);
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: all 0.2s;
  }
  .domain-tab:hover { background: rgba(15, 23, 42, 0.6); }
  .domain-tab.active { background: rgba(30, 41, 59, 0.8); }
  .domain-tab .tab-weight {
    font-size: 0.625rem;
    color: var(--text-muted);
    margin-top: 0.15rem;
  }

  .count-tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  .count-tab {
    padding: 0.625rem;
    font-size: 0.875rem;
    border: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.3);
    color: var(--text-dim);
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .count-tab:hover { background: rgba(15, 23, 42, 0.6); }
  .count-tab.active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: rgba(30, 41, 59, 0.8);
  }

  .weak-toggle {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    cursor: pointer;
  }
  .weak-toggle input { width: 16px; height: 16px; accent-color: var(--cyan); cursor: pointer; }
  .weak-toggle-text { font-size: 0.875rem; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
  .weak-toggle-sub { font-size: 0.7rem; color: var(--text-muted); }

  /* QUIZ */
  .quiz-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
    font-size: 0.75rem;
    margin-bottom: 1rem;
  }
  .quiz-topbar-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .domain-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.375rem 0.75rem;
    border: 1px solid;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.1em;
  }
  .domain-badge .icon { width: 12px; height: 12px; }
  .timer-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.375rem 0.75rem;
    border: 1px solid rgba(251, 191, 36, 0.5);
    color: var(--amber);
    border-radius: 4px;
    font-weight: 700;
  }
  .timer-badge.warn {
    border-color: var(--red);
    color: var(--red);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .progress-thin {
    height: 4px;
    background: rgba(30, 41, 59, 0.8);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 1rem;
  }
  .progress-thin-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    transition: width 0.3s;
    border-radius: 999px;
  }

  .question-panel {
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  @media (min-width: 768px) {
    .question-panel { padding: 2rem; }
  }
  .question-header {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .question-text {
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    color: #f1f5f9;
    flex: 1;
  }
  @media (min-width: 768px) {
    .question-text { font-size: 1.0625rem; }
  }
  .flag-btn {
    flex-shrink: 0;
    padding: 0.5rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .flag-btn:hover {
    border-color: rgba(251, 191, 36, 0.5);
    color: var(--amber);
  }
  .flag-btn.flagged {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(251, 191, 36, 0.1);
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 0.625rem;
  }
  .choice {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 1rem;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    text-align: left;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    transition: all 0.2s;
    width: 100%;
  }
  .choice:hover:not(:disabled):not(.locked) {
    border-color: var(--border-bright);
    background: rgba(30, 41, 59, 0.4);
  }
  .choice .choice-letter {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border: 1px solid currentColor;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }
  .choice .choice-text {
    flex: 1;
    font-size: 0.875rem;
    line-height: 1.5;
  }
  .choice .choice-icon { flex-shrink: 0; width: 20px; height: 20px; }
  .choice.selected {
    border-color: var(--cyan);
    background: rgba(34, 211, 238, 0.1);
    color: #67e8f9;
  }
  .choice.correct {
    border-color: var(--emerald);
    background: rgba(52, 211, 153, 0.1);
    color: #6ee7b7;
  }
  .choice.incorrect {
    border-color: var(--red);
    background: rgba(248, 113, 113, 0.1);
    color: #fca5a5;
  }
  .choice.reveal-correct {
    border-color: rgba(52, 211, 153, 0.6);
    background: rgba(52, 211, 153, 0.05);
    color: #a7f3d0;
  }
  .choice:disabled, .choice.locked { cursor: default; }

  .feedback {
    margin-top: 1.5rem;
    padding: 1rem;
    border-left: 2px solid;
    border-radius: 0 4px 4px 0;
    font-family: 'Inter', sans-serif;
  }
  .feedback.correct {
    border-color: var(--emerald);
    background: rgba(52, 211, 153, 0.05);
  }
  .feedback.incorrect {
    border-color: var(--red);
    background: rgba(248, 113, 113, 0.05);
  }
  .feedback-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
  }
  .feedback.correct .feedback-label { color: var(--emerald); }
  .feedback.incorrect .feedback-label { color: var(--red); }
  .feedback-text {
    font-size: 0.875rem;
    color: #cbd5e1;
    line-height: 1.6;
  }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .nav-counter {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .btn-nav {
    padding: 0.625rem 1rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    transition: all 0.2s;
  }
  .btn-nav:hover:not(:disabled) {
    border-color: var(--border-bright);
  }
  .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-next {
    background: var(--cyan);
    color: #0a0e1a;
    border: none;
    font-weight: 700;
    padding: 0.625rem 1.25rem;
  }
  .btn-next:hover { background: #67e8f9; }
  .btn-submit {
    background: var(--emerald);
    color: #0a0e1a;
    border: none;
    font-weight: 700;
    padding: 0.625rem 1.25rem;
  }
  .btn-submit:hover { background: #6ee7b7; }

  /* QUICK NAV (exam mode) */
  .quick-nav {
    border: 1px solid rgba(51, 65, 85, 0.3);
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.3);
    padding: 1rem;
  }
  .quick-nav-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 0.375rem;
  }
  @media (min-width: 768px) {
    .quick-nav-grid { grid-template-columns: repeat(15, 1fr); }
  }
  .quick-nav-btn {
    aspect-ratio: 1;
    font-size: 0.625rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .quick-nav-btn:hover { border-color: var(--border-bright); }
  .quick-nav-btn.answered {
    border-color: rgba(52, 211, 153, 0.4);
    background: rgba(52, 211, 153, 0.05);
    color: var(--emerald);
  }
  .quick-nav-btn.flagged {
    border-color: rgba(251, 191, 36, 0.6);
    background: rgba(251, 191, 36, 0.1);
    color: var(--amber);
  }
  .quick-nav-btn.current {
    border-color: var(--cyan);
    background: rgba(34, 211, 238, 0.3);
    color: #67e8f9;
  }

  /* RESULTS */
  .score-banner {
    border: 2px solid;
    border-radius: 4px;
    padding: 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .score-banner.passed {
    border-color: var(--emerald);
    background: rgba(52, 211, 153, 0.05);
  }
  .score-banner.failed {
    border-color: var(--amber);
    background: rgba(251, 191, 36, 0.05);
  }
  .score-banner-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    margin-bottom: 0.75rem;
  }
  .score-banner.passed .score-banner-label { color: var(--emerald); }
  .score-banner.failed .score-banner-label { color: var(--amber); }
  .score-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }
  .score-icon { width: 48px; height: 48px; }
  .score-banner.passed .score-icon { color: var(--emerald); }
  .score-banner.failed .score-icon { color: var(--amber); }
  .score-number {
    font-size: 4.5rem;
    font-weight: 700;
    line-height: 1;
  }
  .score-banner.passed .score-number { color: var(--emerald); }
  .score-banner.failed .score-number { color: var(--amber); }
  .score-percent { font-size: 1.5rem; color: var(--text-muted); }
  .score-fraction {
    font-size: 1.25rem;
    color: var(--text);
    margin-bottom: 0.25rem;
  }
  .score-meta {
    font-size: 0.875rem;
    color: var(--text-dim);
  }
  .score-note {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.75rem;
  }

  /* REVIEW */
  .review-section { margin-bottom: 1.5rem; }
  .review-item {
    border: 1px solid rgba(248, 113, 113, 0.2);
    background: rgba(248, 113, 113, 0.05);
    border-radius: 4px;
    margin-bottom: 0.75rem;
  }
  .review-summary {
    padding: 1rem;
    cursor: pointer;
    font-size: 0.875rem;
    color: #f1f5f9;
    font-family: 'Inter', sans-serif;
    list-style: none;
    transition: background 0.2s;
  }
  .review-summary::-webkit-details-marker { display: none; }
  .review-item[open] .review-summary,
  .review-summary:hover { background: rgba(248, 113, 113, 0.1); }
  .review-badge {
    display: inline-block;
    font-size: 0.625rem;
    padding: 0.15rem 0.5rem;
    border: 1px solid;
    border-radius: 3px;
    margin-right: 0.5rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
    vertical-align: middle;
  }
  .review-body {
    padding: 0 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
  }
  .review-body .your-ans { color: #fca5a5; }
  .review-body .correct-ans { color: #6ee7b7; }
  .review-body .ans-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    margin-right: 0.25rem;
  }
  .review-body .explanation {
    color: var(--text-dim);
    border-left: 2px solid rgba(34, 211, 238, 0.5);
    padding-left: 0.75rem;
    margin-top: 0.5rem;
    line-height: 1.6;
  }

  /* STATS */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  @media (min-width: 768px) {
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
  }
  .stat-card {
    border: 1px solid var(--border);
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.3);
    padding: 1rem;
  }
  .stat-card-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
  }
  .stat-card-value { font-size: 1.875rem; font-weight: 700; }

  .session-table {
    border: 1px solid var(--border);
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.3);
    overflow: hidden;
  }
  .session-row {
    display: grid;
    grid-template-columns: 3fr 2fr 2fr 2fr 3fr;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    font-size: 0.75rem;
    border-bottom: 1px solid rgba(30, 41, 59, 0.5);
  }
  .session-row:last-child { border-bottom: none; }
  .session-row.header {
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 0.1em;
    border-bottom: 1px solid var(--border);
  }
  .session-row.data:hover { background: rgba(30, 41, 59, 0.3); }
  .session-mode { text-transform: uppercase; }
  .session-score.high { color: var(--emerald); font-weight: 700; }
  .session-score.mid { color: var(--amber); font-weight: 700; }
  .session-score.low { color: var(--red); font-weight: 700; }

  /* ACTIONS ROW */
  .actions-row {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .actions-row > .btn { flex: 1; min-width: 150px; padding: 0.875rem; font-size: 0.8125rem; font-weight: 700; }

  .footer-note {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-muted);
    padding-top: 1rem;
    margin-top: 1.5rem;
  }

  .hidden { display: none !important; }

  /* Reset confirm */
  .reset-confirm-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .reset-confirm-row .warning {
    font-size: 0.7rem;
    color: var(--red);
  }
  .reset-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 1rem;
  }

  /* Inline svg sizing */
  .icon-sm { width: 16px; height: 16px; }
  .icon-md { width: 20px; height: 20px; }
  .icon-lg { width: 24px; height: 24px; }
  svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* Vertical stack helper */
  .stack > * + * { margin-top: 1.5rem; }
  .stack-sm > * + * { margin-top: 0.75rem; }
</style>
</head>

<script>
// ============================================================
// DATA

const DOMAINS = {
  SC:  { id: "SC",  name: "Security Concepts",            short: "Concepts",   weight: "20%", color: "#22d3ee", iconPath: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>' },
  SM:  { id: "SM",  name: "Security Monitoring",          short: "Monitoring", weight: "25%", color: "#a78bfa", iconPath: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>' },
  HA:  { id: "HA",  name: "Host-Based Analysis",          short: "Host",       weight: "20%", color: "#f472b6", iconPath: '<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>' },
  NIA: { id: "NIA", name: "Network Intrusion Analysis",   short: "Network",    weight: "20%", color: "#fb923c", iconPath: '<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>' },
  PP:  { id: "PP",  name: "Security Policies & Procedures", short: "Policies",  weight: "15%", color: "#4ade80", iconPath: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>' },
};

const QUESTIONS = [
  // ============ SECURITY CONCEPTS (40) ============
  { id: 1, domain: "SC", q: "Which element of the CIA triad ensures that information is accessible only to those authorized to have access?", choices: ["Integrity", "Confidentiality", "Availability", "Accountability"], a: 1, exp: "Confidentiality protects information from unauthorized disclosure. Integrity ensures data is not modified, and Availability ensures systems are accessible when needed." },
  { id: 2, domain: "SC", q: "A threat actor exfiltrates data by altering DNS responses. Which CIA principle is most directly violated?", choices: ["Confidentiality", "Integrity", "Availability", "Non-repudiation"], a: 1, exp: "Altering DNS responses changes legitimate data — this is an integrity violation. Confidentiality would be exposure; availability would be denial of service." },
  { id: 3, domain: "SC", q: "Which security principle ensures users have only the access required to perform their jobs?", choices: ["Need to know", "Defense in depth", "Least privilege", "Separation of duties"], a: 2, exp: "Least privilege limits access rights to the bare minimum needed. 'Need to know' is similar but applies specifically to information access rather than system permissions." },
  { id: 4, domain: "SC", q: "Which term describes a weakness that could be exploited by a threat?", choices: ["Risk", "Threat", "Exploit", "Vulnerability"], a: 3, exp: "A vulnerability is a weakness. A threat is the potential for harm, an exploit is the method used, and risk is the likelihood combined with impact." },
  { id: 5, domain: "SC", q: "What is the primary goal of defense in depth?", choices: ["Eliminate all vulnerabilities", "Use a single strong control", "Layer multiple security controls", "Reduce security spending"], a: 2, exp: "Defense in depth uses multiple overlapping layers so that if one fails, others still provide protection." },
  { id: 6, domain: "SC", q: "Which access control model uses labels and clearance levels to enforce policy?", choices: ["DAC", "MAC", "RBAC", "ABAC"], a: 1, exp: "Mandatory Access Control (MAC) uses sensitivity labels (e.g., Secret, Top Secret) and clearances. DAC is owner-discretionary; RBAC uses roles; ABAC uses attributes." },
  { id: 7, domain: "SC", q: "In RBAC, permissions are assigned to:", choices: ["Individual users directly", "Roles which users are then assigned to", "Resources only", "Groups based on location"], a: 1, exp: "Role-Based Access Control assigns permissions to roles, and users inherit permissions by being assigned to a role." },
  { id: 8, domain: "SC", q: "Which Cyber Kill Chain phase involves the attacker gathering information about a target?", choices: ["Weaponization", "Reconnaissance", "Delivery", "Exploitation"], a: 1, exp: "Reconnaissance is the first phase of the Lockheed Martin Cyber Kill Chain — the attacker researches and identifies targets." },
  { id: 9, domain: "SC", q: "An attacker pairs a malicious payload with an exploit to create a deliverable artifact. Which kill chain phase is this?", choices: ["Reconnaissance", "Weaponization", "Delivery", "Installation"], a: 1, exp: "Weaponization is creating the deliverable malicious payload (e.g., a weaponized PDF or Office document with embedded exploit)." },
  { id: 10, domain: "SC", q: "An attacker emails a malicious attachment to an employee. Which kill chain phase does this represent?", choices: ["Weaponization", "Delivery", "Exploitation", "Installation"], a: 1, exp: "Delivery is transmission of the weapon to the target — common vectors include email attachments, USB drives, and websites." },
  { id: 11, domain: "SC", q: "After exploitation, malware drops a backdoor on the host. Which kill chain phase is this?", choices: ["Exploitation", "Installation", "Command and Control", "Actions on Objectives"], a: 1, exp: "Installation establishes persistence on the victim system, often by installing a remote access trojan or backdoor." },
  { id: 12, domain: "SC", q: "Compromised hosts beacon to an external server for instructions. Which kill chain phase is this?", choices: ["Installation", "Command and Control", "Exploitation", "Reconnaissance"], a: 1, exp: "Command and Control (C2) establishes a channel for the attacker to remotely control the compromised host." },
  { id: 13, domain: "SC", q: "The four core features of the Diamond Model of Intrusion Analysis are:", choices: ["Threat, Vulnerability, Risk, Asset", "Adversary, Capability, Infrastructure, Victim", "People, Process, Technology, Data", "Reconnaissance, Delivery, Exploitation, Installation"], a: 1, exp: "The Diamond Model's four vertices are Adversary, Capability, Infrastructure, and Victim." },
  { id: 14, domain: "SC", q: "Which Diamond Model feature represents the tools and techniques used by the attacker?", choices: ["Adversary", "Capability", "Infrastructure", "Victim"], a: 1, exp: "Capability represents the tools, malware, and TTPs the adversary uses." },
  { id: 15, domain: "SC", q: "A vulnerability is rated 9.8 in CVSS v3. This indicates:", choices: ["Low severity", "Medium severity", "High severity", "Critical severity"], a: 3, exp: "CVSS v3 ratings: 0.1–3.9 Low, 4.0–6.9 Medium, 7.0–8.9 High, 9.0–10.0 Critical." },
  { id: 16, domain: "SC", q: "Which CVSS metric group can change over time as patches and exploits emerge?", choices: ["Base", "Temporal", "Environmental", "Impact"], a: 1, exp: "Temporal metrics reflect characteristics that change over time (exploit code maturity, remediation level, report confidence). Base metrics are constant; Environmental are organization-specific." },
  { id: 17, domain: "SC", q: "Which attack manipulates a user into performing an action through deception?", choices: ["Buffer overflow", "Social engineering", "SQL injection", "DoS"], a: 1, exp: "Social engineering exploits human psychology rather than technical vulnerabilities." },
  { id: 18, domain: "SC", q: "Targeted phishing aimed at a specific high-value individual is called:", choices: ["Phishing", "Vishing", "Spear phishing", "Whaling"], a: 3, exp: "Whaling targets executives or other high-value individuals. Spear phishing is targeted but not necessarily at executives." },
  { id: 19, domain: "SC", q: "An attacker leaves an infected USB drive in a parking lot. This technique is:", choices: ["Tailgating", "Pretexting", "Baiting", "Quid pro quo"], a: 2, exp: "Baiting uses physical or digital lures (USB drives, free downloads) to trick targets into compromising themselves." },
  { id: 20, domain: "SC", q: "What does PKI primarily provide?", choices: ["Symmetric key distribution", "Asymmetric key management and digital certificates", "Password hashing", "Network segmentation"], a: 1, exp: "Public Key Infrastructure manages asymmetric key pairs and issues/revokes digital certificates that bind public keys to identities." },
  { id: 21, domain: "SC", q: "What is the purpose of a Certificate Revocation List (CRL)?", choices: ["List trusted CAs", "List certificates that should no longer be trusted", "Store private keys", "Encrypt traffic"], a: 1, exp: "A CRL is published by the CA and lists certificates that have been revoked before their expiration date." },
  { id: 22, domain: "SC", q: "Which protocol provides real-time validation of certificate status?", choices: ["CRL", "OCSP", "SCEP", "EST"], a: 1, exp: "Online Certificate Status Protocol (OCSP) lets clients query the CA in real time for the status of a single certificate." },
  { id: 23, domain: "SC", q: "Which type of attack alters data in transit between two parties?", choices: ["DoS", "Man-in-the-middle", "Replay", "Spoofing"], a: 1, exp: "A MitM attacker positions between two parties and can read, modify, or inject data into the communication." },
  { id: 24, domain: "SC", q: "A SYN flood is an example of which type of attack?", choices: ["Resource exhaustion DoS", "Reflection attack", "Application-layer attack", "Privilege escalation"], a: 0, exp: "A SYN flood exhausts the server's connection table by sending SYN packets without completing the TCP handshake." },
  { id: 25, domain: "SC", q: "Which attack uses spoofed source IPs to elicit large responses to the victim?", choices: ["SYN flood", "Reflection/amplification", "Slowloris", "Teardrop"], a: 1, exp: "Reflection/amplification (e.g., DNS, NTP, memcached) sends small queries with the victim's IP as source so the response is reflected to the victim." },
  { id: 26, domain: "SC", q: "Which web attack injects malicious script that executes in another user's browser?", choices: ["SQL injection", "Cross-site scripting (XSS)", "CSRF", "Command injection"], a: 1, exp: "XSS injects scripts into web pages viewed by other users. CSRF tricks users into making unwanted requests; SQLi targets databases." },
  { id: 27, domain: "SC", q: "Which web attack tricks an authenticated user into submitting a request they did not intend?", choices: ["XSS", "CSRF", "SQL injection", "SSRF"], a: 1, exp: "Cross-Site Request Forgery rides on the user's existing authenticated session to perform actions on their behalf." },
  { id: 28, domain: "SC", q: "Which type of malware encrypts files and demands payment for decryption?", choices: ["Worm", "Rootkit", "Ransomware", "Spyware"], a: 2, exp: "Ransomware encrypts files and extorts payment, often in cryptocurrency, for the decryption key." },
  { id: 29, domain: "SC", q: "Which malware hides its presence by subverting the OS kernel?", choices: ["Trojan", "Rootkit", "Adware", "Worm"], a: 1, exp: "Rootkits operate at low levels (often kernel) to hide processes, files, and network connections from defenders." },
  { id: 30, domain: "SC", q: "What is the primary characteristic of a worm versus a virus?", choices: ["A worm requires user interaction", "A worm self-propagates without a host file", "A worm is always destructive", "A worm only targets servers"], a: 1, exp: "Worms self-replicate across networks without needing to attach to a host file or user interaction." },
  { id: 31, domain: "SC", q: "Which evasion technique varies code in each instance of malware?", choices: ["Encryption", "Polymorphism", "Steganography", "Tunneling"], a: 1, exp: "Polymorphic malware mutates its code with each infection while keeping functionality, defeating signature-based detection." },
  { id: 32, domain: "SC", q: "An attacker hides command-and-control traffic inside DNS queries. This is an example of:", choices: ["Encryption", "Tunneling/covert channel", "Fragmentation", "Spoofing"], a: 1, exp: "DNS tunneling encodes data inside DNS queries/responses to bypass filtering — a covert channel evasion technique." },
  { id: 33, domain: "SC", q: "Which term describes the trust relationship that allows traffic from one zone to enter another?", choices: ["VLAN", "ACL", "Security zone policy", "VPN"], a: 2, exp: "Security zones with explicit policies between them control traffic flow — a foundational firewall concept." },
  { id: 34, domain: "SC", q: "Which type of evidence is most volatile and should be collected first?", choices: ["Disk image", "RAM contents", "Backup tapes", "Printed logs"], a: 1, exp: "RFC 3227 order of volatility: registers/cache, RAM, network state, running processes, disk, remote logs, physical media." },
  { id: 35, domain: "SC", q: "Which term refers to information about an attacker's motives, methods, and infrastructure?", choices: ["Threat intelligence", "Risk register", "Vulnerability scan", "Penetration test"], a: 0, exp: "Threat intelligence is contextual information about adversaries used to inform defensive decisions." },
  { id: 36, domain: "SC", q: "STIX and TAXII are standards used for:", choices: ["Encrypting data at rest", "Sharing cyber threat intelligence", "Securing wireless networks", "Identity federation"], a: 1, exp: "STIX is the data format and TAXII is the transport protocol for sharing threat intelligence between organizations." },
  { id: 37, domain: "SC", q: "Which document describes how an organization formally allocates security responsibilities?", choices: ["AUP", "Security policy", "BCP", "RFC"], a: 1, exp: "A security policy is the high-level document that defines roles, responsibilities, and rules for protecting assets." },
  { id: 38, domain: "SC", q: "Which factor is NOT part of multi-factor authentication?", choices: ["Something you know", "Something you have", "Something you are", "Something you want"], a: 3, exp: "MFA factors are knowledge (know), possession (have), inherence (are), and sometimes location (are at) or behavior. 'Want' is not a factor." },
  { id: 39, domain: "SC", q: "Which type of attack guesses passwords using a list of common words?", choices: ["Brute-force", "Dictionary attack", "Rainbow table", "Pass-the-hash"], a: 1, exp: "Dictionary attacks try entries from a word list. Brute-force tries all combinations; rainbow tables use precomputed hashes; PtH reuses captured hashes." },
  { id: 40, domain: "SC", q: "Which principle ensures one person cannot complete a sensitive task alone?", choices: ["Least privilege", "Separation of duties", "Need to know", "Defense in depth"], a: 1, exp: "Separation of duties splits a sensitive process between people to reduce fraud and error." },

  // ============ SECURITY MONITORING (40) ============
  { id: 41, domain: "SM", q: "Which tool aggregates and correlates logs from multiple sources for analysis?", choices: ["IDS", "SIEM", "Firewall", "Proxy"], a: 1, exp: "Security Information and Event Management (SIEM) collects, normalizes, and correlates logs to enable detection and investigation." },
  { id: 42, domain: "SM", q: "What is the primary purpose of SOAR?", choices: ["Encrypting logs", "Automating and orchestrating security operations", "Replacing firewalls", "Managing certificates"], a: 1, exp: "Security Orchestration, Automation, and Response automates repetitive SOC tasks via playbooks and integrates tools." },
  { id: 43, domain: "SM", q: "NetFlow primarily provides which type of information?", choices: ["Full packet payload", "Metadata about IP conversations", "Operating system logs", "Endpoint process trees"], a: 1, exp: "NetFlow records flow metadata (source/dest IP, ports, protocol, bytes, packets) — not packet content." },
  { id: 44, domain: "SM", q: "Which fields make up the classic 5-tuple?", choices: ["Source IP, dest IP, source MAC, dest MAC, protocol", "Source IP, source port, dest IP, dest port, protocol", "Username, source IP, dest IP, port, time", "VLAN, source IP, dest IP, source port, dest port"], a: 1, exp: "The 5-tuple uniquely identifies a flow: source IP, source port, destination IP, destination port, and protocol." },
  { id: 45, domain: "SM", q: "Which monitoring technique inspects the contents of packets beyond headers?", choices: ["NetFlow", "Deep packet inspection", "SNMP polling", "Flow sampling"], a: 1, exp: "DPI examines packet payloads to identify applications, content, and threats." },
  { id: 46, domain: "SM", q: "Which is a key limitation of monitoring TLS-encrypted traffic without decryption?", choices: ["You cannot see source IPs", "You cannot inspect application-layer payload", "You cannot record flows", "You cannot capture packets"], a: 1, exp: "Encryption obscures the payload. Headers, SNI, certificate metadata, and flow data are still visible." },
  { id: 47, domain: "SM", q: "Which SSL/TLS field reveals the destination hostname even when traffic is encrypted?", choices: ["Cipher suite", "Server Name Indication (SNI)", "Session ID", "Master secret"], a: 1, exp: "SNI is sent in clear during the TLS handshake so servers can present the correct certificate." },
  { id: 48, domain: "SM", q: "Which technique is used to inspect TLS traffic on a corporate network?", choices: ["TLS downgrade", "Certificate pinning", "TLS interception/decryption with a corporate CA", "Stateful packet filtering"], a: 2, exp: "Decrypting middleboxes terminate the client TLS, inspect, and re-encrypt to the server using a trusted internal CA." },
  { id: 49, domain: "SM", q: "Which detection method matches traffic against known patterns?", choices: ["Anomaly-based", "Signature-based", "Heuristic", "Statistical"], a: 1, exp: "Signature-based detection compares observed activity to a database of known-bad patterns. Effective for known threats but misses novel ones." },
  { id: 50, domain: "SM", q: "An IDS alerts on legitimate activity. This is a:", choices: ["True positive", "True negative", "False positive", "False negative"], a: 2, exp: "False positive = alert on benign activity. False negative = missed real attack." },
  { id: 51, domain: "SM", q: "Real malicious activity that goes undetected is a:", choices: ["True positive", "False positive", "False negative", "True negative"], a: 2, exp: "False negative — a real threat that the system failed to alert on. The most dangerous type of error." },
  { id: 52, domain: "SM", q: "Which technique converts log data into a common format for correlation?", choices: ["Encryption", "Normalization", "Compression", "Aggregation"], a: 1, exp: "Normalization parses and reformats heterogeneous logs into common fields so they can be correlated." },
  { id: 53, domain: "SM", q: "Which technique reduces duplicate alerts to a single event?", choices: ["Normalization", "Deduplication", "Enrichment", "Anonymization"], a: 1, exp: "Deduplication collapses repeated identical events; enrichment adds context like geo-IP or threat intel." },
  { id: 54, domain: "SM", q: "Adding threat intelligence context to a log entry is called:", choices: ["Normalization", "Enrichment", "Aggregation", "Compression"], a: 1, exp: "Enrichment supplements raw events with additional context (geolocation, reputation, asset info) to aid analysis." },
  { id: 55, domain: "SM", q: "Which monitoring approach captures every packet on the wire?", choices: ["NetFlow", "Full packet capture", "Syslog", "SNMP"], a: 1, exp: "Full packet capture records the entire packet (headers and payload). Storage-intensive but provides complete forensic detail." },
  { id: 56, domain: "SM", q: "Which mechanism mirrors traffic from switch ports to a monitoring device?", choices: ["Trunk", "SPAN/port mirror", "VTP", "STP"], a: 1, exp: "SPAN (Switched Port Analyzer) copies frames from selected ports/VLANs to a destination port for analysis." },
  { id: 57, domain: "SM", q: "Which device is typically dedicated to copying network traffic without altering it?", choices: ["Router", "Firewall", "Network tap", "Load balancer"], a: 2, exp: "A network tap is a hardware device placed inline that passively duplicates traffic to monitoring tools." },
  { id: 58, domain: "SM", q: "Which is a primary advantage of using NetFlow over full packet capture?", choices: ["Higher detail", "Lower storage and processing requirements", "Sees encrypted payload", "Replays traffic"], a: 1, exp: "Flow records are far smaller than full packets, making long-term retention feasible." },
  { id: 59, domain: "SM", q: "Which file format do most packet capture tools use?", choices: [".log", ".pcap", ".csv", ".evt"], a: 1, exp: "PCAP (or PCAPNG) is the de facto packet capture format used by Wireshark, tcpdump, and most analyzers." },
  { id: 60, domain: "SM", q: "Which Wireshark feature reconstructs an entire TCP conversation into readable text?", choices: ["Capture filter", "Follow TCP Stream", "Coloring rules", "Decode As"], a: 1, exp: "Follow TCP Stream reassembles a TCP conversation so analysts can read application data in order." },
  { id: 61, domain: "SM", q: "Which protocol is commonly used to ship logs to a central collector?", choices: ["FTP", "Syslog", "SMTP", "DHCP"], a: 1, exp: "Syslog (UDP/TCP 514, or 6514 over TLS) is the long-standing standard for log transport on Unix-like and many network devices." },
  { id: 62, domain: "SM", q: "Which technology profiles users and entities to find anomalous behavior?", choices: ["UEBA", "SIEM", "WAF", "DLP"], a: 0, exp: "User and Entity Behavior Analytics builds baselines and flags deviations (e.g., off-hours access, impossible travel)." },
  { id: 63, domain: "SM", q: "An analyst correlates an authentication log with a firewall log using:", choices: ["A common timestamp and source IP", "MAC addresses only", "Hash values", "Random IDs"], a: 0, exp: "Correlation typically pivots on shared fields like timestamp, source IP, username, or session ID." },
  { id: 64, domain: "SM", q: "Which is NOT a typical SOC tier 1 responsibility?", choices: ["Triage alerts", "Initial investigation", "Develop new detection signatures", "Escalate incidents"], a: 2, exp: "Tier 1 triages and escalates. Detection engineering and complex hunting are typically tier 2/3 responsibilities." },
  { id: 65, domain: "SM", q: "Which type of NIDS deployment can drop traffic in real time?", choices: ["Out-of-band IDS", "Inline IPS", "Passive sensor", "Span-based monitor"], a: 1, exp: "An IPS sits inline and can block traffic. An IDS observes copies of traffic and only alerts." },
  { id: 66, domain: "SM", q: "Which is a major drawback of placing security sensors inline?", choices: ["Cannot detect threats", "Becomes a single point of failure", "Cannot decode packets", "Generates too few logs"], a: 1, exp: "Inline devices can introduce latency or fail-close/fail-open issues. They must be sized and deployed carefully." },
  { id: 67, domain: "SM", q: "Tap and SPAN both provide visibility, but SPAN is more likely to:", choices: ["Capture all errored frames", "Drop frames under heavy load", "Add no latency", "Avoid duplication"], a: 1, exp: "SPAN ports can drop frames under congestion and may not forward errored frames; taps are typically more reliable for capture." },
  { id: 68, domain: "SM", q: "What is the primary purpose of a baseline in security monitoring?", choices: ["Document system uptime", "Define normal behavior to detect deviations", "Hash configuration files", "Calculate licensing"], a: 1, exp: "A baseline of normal activity makes anomalies stand out — fundamental to anomaly-based detection." },
  { id: 69, domain: "SM", q: "Which artifact is most useful for identifying lateral movement via authentication?", choices: ["Web server access logs", "Windows Security Event ID 4624/4625 logs", "DNS A records", "DHCP leases"], a: 1, exp: "Windows logon/logoff events (4624 success, 4625 failure) reveal authentication patterns across hosts." },
  { id: 70, domain: "SM", q: "Which Windows event ID indicates a successful logon?", choices: ["4624", "4625", "4634", "4688"], a: 0, exp: "4624 = successful logon. 4625 = failed logon. 4634 = logoff. 4688 = process creation." },
  { id: 71, domain: "SM", q: "An analyst sees many 4625 events from one source. This most likely indicates:", choices: ["Successful login", "Logoff", "Password spray or brute force", "Account lockout reset"], a: 2, exp: "Repeated failed logons (4625) from a single source against many accounts is the signature of password spraying/brute force." },
  { id: 72, domain: "SM", q: "Which DNS query type is commonly abused in tunneling for high data exfil?", choices: ["A", "PTR", "TXT", "MX"], a: 2, exp: "TXT records can carry arbitrary strings, making them attractive for encoding exfiltrated data in DNS tunneling." },
  { id: 73, domain: "SM", q: "Which indicator is most likely to indicate beaconing C2 traffic?", choices: ["Variable jitter, large payloads", "Regular intervals to the same external host", "Bursty TCP retransmits", "Random UDP probes"], a: 1, exp: "C2 beaconing typically shows periodic check-ins on regular intervals to a controller, often with small payloads." },
  { id: 74, domain: "SM", q: "Which Cisco platform provides flow-based monitoring with security analytics?", choices: ["Stealthwatch / Secure Network Analytics", "Meraki MX", "ISE", "Umbrella"], a: 0, exp: "Cisco Stealthwatch (now Secure Network Analytics) consumes NetFlow/IPFIX and applies behavioral analytics." },
  { id: 75, domain: "SM", q: "An analyst needs to validate a signature alert. Which artifact provides definitive content?", choices: ["NetFlow record", "Full packet capture for the flow", "Firewall hit count", "DNS log"], a: 1, exp: "PCAP gives the actual payload, allowing validation of true vs false positives at the byte level." },
  { id: 76, domain: "SM", q: "Which is a primary purpose of log retention policies?", choices: ["Reduce storage", "Meet compliance and support investigation", "Prevent encryption", "Increase logging speed"], a: 1, exp: "Retention balances storage cost with compliance requirements (e.g., PCI-DSS one year) and incident lookback needs." },
  { id: 77, domain: "SM", q: "Which device function is best suited to collect and forward syslog from many devices?", choices: ["DNS resolver", "Syslog relay/collector", "Time server", "DHCP server"], a: 1, exp: "A syslog relay aggregates logs from many sources and forwards (often securely) to the SIEM, reducing direct connections." },
  { id: 78, domain: "SM", q: "Which is true about NTP for monitoring infrastructure?", choices: ["Optional, has no impact on logs", "Critical for accurate event correlation across systems", "Only needed for routers", "Replaces syslog"], a: 1, exp: "Synchronized time is essential — without it, correlating events across devices is unreliable." },
  { id: 79, domain: "SM", q: "Which protocol/technology helps detect MAC address spoofing on a switch?", choices: ["DHCP snooping with Dynamic ARP Inspection", "BGP", "OSPF", "RADIUS"], a: 0, exp: "DHCP snooping builds a binding table that DAI uses to validate ARP packets, detecting spoofing." },
  { id: 80, domain: "SM", q: "Which is the BEST way to spot data exfiltration over HTTPS?", choices: ["Inspect cipher suites", "Look for unusually large outbound flows to unknown destinations", "Block all TLS", "Disable DNS"], a: 1, exp: "Without decryption, volumetric and behavioral indicators (size, destination reputation, periodicity) are key." },

  // ============ HOST-BASED ANALYSIS (35) ============
  { id: 81, domain: "HA", q: "Which Windows component logs application, system, and security events?", choices: ["Performance Monitor", "Event Viewer", "Task Scheduler", "Resource Monitor"], a: 1, exp: "Windows Event Viewer (eventvwr.msc) reads .evtx logs in System, Application, and Security channels." },
  { id: 82, domain: "HA", q: "On Linux, which file commonly stores user account information?", choices: ["/etc/shadow", "/etc/passwd", "/etc/sudoers", "/etc/hostname"], a: 1, exp: "/etc/passwd lists user accounts. /etc/shadow stores password hashes (root-readable)." },
  { id: 83, domain: "HA", q: "Where are encrypted password hashes stored on a modern Linux system?", choices: ["/etc/passwd", "/etc/shadow", "/etc/group", "/var/log/auth.log"], a: 1, exp: "/etc/shadow holds the hashed passwords and is readable only by root, separating it from world-readable /etc/passwd." },
  { id: 84, domain: "HA", q: "Which Linux log typically records authentication events on Debian-based systems?", choices: ["/var/log/messages", "/var/log/auth.log", "/var/log/dmesg", "/var/log/cron"], a: 1, exp: "/var/log/auth.log captures sshd, sudo, and other authentication events on Debian/Ubuntu. RHEL uses /var/log/secure." },
  { id: 85, domain: "HA", q: "Which Windows event ID is generated when a new process is created?", choices: ["4624", "4625", "4688", "5140"], a: 2, exp: "4688 logs process creation when audit policy is configured. Critical for endpoint forensics." },
  { id: 86, domain: "HA", q: "Which artifact in Windows persists user-launched programs even after deletion?", choices: ["Prefetch", "MFT", "USN Journal", "Registry only"], a: 0, exp: "Windows Prefetch (.pf) files in %SystemRoot%\\Prefetch record application execution metadata for performance — and forensics." },
  { id: 87, domain: "HA", q: "Which Windows registry hive contains autostart entries that run for all users?", choices: ["HKCU", "HKLM", "HKU", "HKCR"], a: 1, exp: "HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run starts programs for any user at logon." },
  { id: 88, domain: "HA", q: "Which is a common malware persistence location?", choices: ["Recycle Bin", "Run/RunOnce registry keys and Scheduled Tasks", "Pagefile", "Hosts file"], a: 1, exp: "Run keys and scheduled tasks are textbook persistence techniques. Services and WMI subscriptions are also common." },
  { id: 89, domain: "HA", q: "Which Windows binary is often abused via DLL search-order hijacking?", choices: ["explorer.exe", "Any application that loads DLLs without absolute paths", "regedit.exe", "wininit.exe"], a: 1, exp: "Apps that load DLLs by name without absolute paths can be tricked into loading attacker DLLs from a search path location." },
  { id: 90, domain: "HA", q: "Which tool from Sysinternals lists running processes with full command lines and parents?", choices: ["Process Explorer", "Autoruns", "PsLogList", "TCPView"], a: 0, exp: "Process Explorer shows process tree, command lines, loaded DLLs, handles, and signing status." },
  { id: 91, domain: "HA", q: "Which Sysinternals tool inventories autostart locations across Windows?", choices: ["Autoruns", "Procmon", "PsExec", "BgInfo"], a: 0, exp: "Autoruns enumerates dozens of autostart points (Run keys, services, scheduled tasks, WMI, drivers, etc.)." },
  { id: 92, domain: "HA", q: "Which is the primary purpose of a sandbox in malware analysis?", choices: ["Sign binaries", "Execute suspicious code in isolation to observe behavior", "Patch vulnerabilities", "Block phishing"], a: 1, exp: "Sandboxes provide an instrumented, isolated environment to detonate samples and capture behavior." },
  { id: 93, domain: "HA", q: "Static analysis of a binary involves:", choices: ["Executing the file and observing it", "Examining the file without execution", "Modifying the file", "Patching the OS"], a: 1, exp: "Static analysis examines code, strings, hashes, imports, and structure without running the sample." },
  { id: 94, domain: "HA", q: "Which is a strong indicator that a process is malicious?", choices: ["Signed by trusted publisher", "Spawned by a Word document and connecting to an unknown IP", "Listed in Microsoft documentation", "Running with low CPU"], a: 1, exp: "Office spawning unusual children (powershell, cmd, wscript) that beacon out is a hallmark of macro-based attacks." },
  { id: 95, domain: "HA", q: "Which Windows technology monitors detailed endpoint activity for forensics?", choices: ["Sysmon", "Bitlocker", "Defender Firewall", "Group Policy"], a: 0, exp: "Sysmon (System Monitor) is a Sysinternals service that logs detailed events: process creation with hashes, network connections, file create time changes, image loads, and more." },
  { id: 96, domain: "HA", q: "Which hash algorithm is generally considered cryptographically broken?", choices: ["SHA-256", "SHA-3", "MD5", "BLAKE2"], a: 2, exp: "MD5 has practical collision attacks and should not be used for security purposes. SHA-1 is also deprecated." },
  { id: 97, domain: "HA", q: "Which is a typical use of file hashing in incident response?", choices: ["Encrypting evidence", "Verifying integrity and identifying known files", "Compressing logs", "Replacing certificates"], a: 1, exp: "Hashes verify evidence integrity (chain of custody) and match against known-good or known-bad lists (NSRL, threat intel)." },
  { id: 98, domain: "HA", q: "Which is a typical EDR capability?", choices: ["Routing protocols", "Continuous endpoint telemetry, threat detection, and response actions", "Domain registration", "Wi-Fi authentication"], a: 1, exp: "Endpoint Detection and Response continuously collects endpoint data, detects threats, and supports response (kill, isolate, contain)." },
  { id: 99, domain: "HA", q: "Which Linux command displays open files including network sockets?", choices: ["lsof", "ls", "lsblk", "lsmod"], a: 0, exp: "lsof (list open files) shows files, pipes, sockets, and the processes that hold them." },
  { id: 100, domain: "HA", q: "Which Linux command shows currently running processes?", choices: ["lsof", "ps / top / htop", "cat", "df"], a: 1, exp: "ps, top, and htop display running processes. /proc/<pid>/ also exposes detailed per-process info." },
  { id: 101, domain: "HA", q: "Which Linux directory contains kernel and process information as virtual files?", choices: ["/etc", "/proc", "/var", "/usr"], a: 1, exp: "/proc is a virtual filesystem exposing kernel and per-process data. /sys exposes device/driver info." },
  { id: 102, domain: "HA", q: "Which Windows feature mitigates exploitation by randomizing memory layout?", choices: ["DEP", "ASLR", "UAC", "SmartScreen"], a: 1, exp: "Address Space Layout Randomization randomizes module base addresses to make exploitation harder." },
  { id: 103, domain: "HA", q: "Which Windows feature blocks code execution from non-executable memory pages?", choices: ["ASLR", "DEP", "UAC", "AppLocker"], a: 1, exp: "Data Execution Prevention marks data regions non-executable to thwart classic stack/heap shellcode execution." },
  { id: 104, domain: "HA", q: "An attacker dumps lsass.exe memory. They are most likely after:", choices: ["Browser cookies", "Cached credentials and tickets", "DNS records", "Disk encryption keys only"], a: 1, exp: "LSASS holds credential material — NTLM hashes, Kerberos tickets, plaintext from WDigest. Tools like Mimikatz target it." },
  { id: 105, domain: "HA", q: "Which file system is native to modern Windows?", choices: ["ext4", "APFS", "NTFS", "ZFS"], a: 2, exp: "NTFS supports ACLs, journaling, and alternate data streams. ReFS is also Microsoft but used in specific scenarios." },
  { id: 106, domain: "HA", q: "Which NTFS feature can be abused to hide data inside a normal file?", choices: ["ACL", "Alternate Data Streams", "Sparse files", "Hard links"], a: 1, exp: "ADS allows additional data streams attached to a file (file.txt:hidden.exe). Defenders should enumerate streams." },
  { id: 107, domain: "HA", q: "Which Linux file system journal feature is useful for forensics?", choices: ["Tracks deleted file recovery hints", "Encrypts data automatically", "Compresses files", "Replaces ACLs"], a: 0, exp: "Journals (ext3/4) record metadata changes and can help reconstruct activity around deleted files." },
  { id: 108, domain: "HA", q: "Which is the primary value of disk imaging in forensics?", choices: ["Speeds up investigation", "Preserves a bit-for-bit copy without altering the original", "Encrypts evidence", "Reduces storage"], a: 1, exp: "A forensic image (e.g., dd, EnCase E01) is a verifiable bit-for-bit copy enabling repeatable analysis." },
  { id: 109, domain: "HA", q: "Which is a strong indicator of a fileless attack?", choices: ["Many new EXEs on disk", "PowerShell encoded commands and in-memory execution", "Scheduled OS updates", "Routine GPO changes"], a: 1, exp: "Fileless attacks live in memory and use LOLBins (PowerShell, WMI, mshta) — minimal disk footprint." },
  { id: 110, domain: "HA", q: "Which is the most reliable way to confirm a malware family from a sample?", choices: ["File name", "Hash compared against known threat intel", "File size", "Icon"], a: 1, exp: "File names and icons are trivially changed. Hashes (SHA-256) and YARA rules give reliable identification." },
  { id: 111, domain: "HA", q: "Which Windows tool shows scheduled tasks?", choices: ["schtasks / Task Scheduler", "ipconfig", "netstat", "whoami"], a: 0, exp: "schtasks lists/manages scheduled tasks; Task Scheduler MMC provides a GUI. Tasks are a common persistence mechanism." },
  { id: 112, domain: "HA", q: "Which command shows active TCP/UDP connections on Windows?", choices: ["whoami", "netstat -ano", "ipconfig", "systeminfo"], a: 1, exp: "netstat -ano lists connections with PID; pivot to tasklist or Process Explorer to identify the process." },
  { id: 113, domain: "HA", q: "Which artifact records every program executed on Windows for performance prefetching?", choices: ["Pagefile", "Prefetch files", "Hosts file", "SAM"], a: 1, exp: "Prefetch (%SystemRoot%\\Prefetch\\*.pf) shows execution evidence even after the binary is deleted." },
  { id: 114, domain: "HA", q: "Which artifact in Windows tracks recently opened files (per user)?", choices: ["Recycle Bin", "Jump Lists / Recent items", "Prefetch", "SRUM"], a: 1, exp: "Jump Lists and Recent folders show user file access — useful for proving user activity on a host." },
  { id: 115, domain: "HA", q: "When isolating an infected host, which action preserves the most volatile evidence?", choices: ["Power off immediately", "Network-isolate while leaving running, capture memory", "Reimage the host", "Delete suspicious files"], a: 1, exp: "Pulling network access stops the attacker but leaves memory intact; capturing RAM and key live artifacts preserves volatile evidence." },

  // ============ NETWORK INTRUSION ANALYSIS (35) ============
  { id: 116, domain: "NIA", q: "Which OSI layer does an Ethernet frame primarily operate at?", choices: ["Layer 1", "Layer 2", "Layer 3", "Layer 4"], a: 1, exp: "Ethernet operates at Layer 2 (Data Link). It uses MAC addresses to deliver frames within a local segment." },
  { id: 117, domain: "NIA", q: "Which protocol resolves IP addresses to MAC addresses on a LAN?", choices: ["DNS", "ARP", "DHCP", "ICMP"], a: 1, exp: "Address Resolution Protocol maps IPv4 addresses to MAC addresses. ARP spoofing/poisoning is a common LAN attack." },
  { id: 118, domain: "NIA", q: "Which TCP flags are set in the first packet of a 3-way handshake?", choices: ["SYN", "SYN+ACK", "ACK", "FIN"], a: 0, exp: "Client sends SYN; server replies SYN+ACK; client sends ACK to complete the handshake." },
  { id: 119, domain: "NIA", q: "An analyst sees many TCP packets with only the FIN flag from one source to many ports on a host. This is most likely:", choices: ["Normal browsing", "FIN scan", "DNS query", "ARP request"], a: 1, exp: "FIN/NULL/Xmas scans probe ports with unusual flag combinations to elicit RST from closed ports — a stealth scanning technique." },
  { id: 120, domain: "NIA", q: "Which Wireshark display filter shows only HTTP requests?", choices: ["http", "http.request", "tcp.port==80", "ip.proto==6"], a: 1, exp: "http.request matches request packets specifically. 'http' shows all HTTP traffic." },
  { id: 121, domain: "NIA", q: "Which protocol typically uses TCP port 443?", choices: ["HTTP", "HTTPS / TLS", "DNS", "SSH"], a: 1, exp: "HTTPS (HTTP over TLS) defaults to TCP/443. Modern web also uses 443 for HTTP/3 over QUIC (UDP)." },
  { id: 122, domain: "NIA", q: "Which protocol/port is most commonly used for DNS queries?", choices: ["TCP/22", "UDP/53", "UDP/67", "TCP/389"], a: 1, exp: "DNS uses UDP/53 for most queries and TCP/53 for large responses (>512 bytes) and zone transfers." },
  { id: 123, domain: "NIA", q: "Which Wireshark filter shows packets to or from a specific IP?", choices: ["host 1.2.3.4", "ip.addr==1.2.3.4", "src 1.2.3.4", "addr 1.2.3.4"], a: 1, exp: "Wireshark display filter syntax is ip.addr==1.2.3.4. Note: 'host' is BPF capture filter syntax (different language)." },

// ============================================================
// STATE
// ============================================================
const STORAGE_KEY = "cbrops_stats_v1";
const DEFAULT_STATS = { totalAnswered: 0, totalCorrect: 0, byDomain: {}, byQuestion: {}, sessions: [] };

let stats = loadStats();
let session = null;
let configState = { mode: "study", domain: "ALL", count: 25, weakOnly: false };
let timerInterval = null;

function loadStats() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...DEFAULT_STATS };
    return { ...DEFAULT_STATS, ...JSON.parse(raw) };
  } catch { return { ...DEFAULT_STATS }; }
}
function saveStats() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch {}
}

// ============================================================
// VIEW SWITCHING
// ============================================================
const VIEWS = ["home", "mode", "quiz", "results", "stats"];
function showView(name) {
  VIEWS.forEach(v => {
    document.getElementById("view-" + v).classList.toggle("hidden", v !== name);
  });
  document.getElementById("back-btn").classList.toggle("hidden", name === "home");
  if (name === "home") renderHome();
  if (name === "stats") renderStats();
  window.scrollTo(0, 0);
}

// ============================================================
// HOME VIEW
// ============================================================
function renderHome() {
  const overallPct = stats.totalAnswered > 0 ? Math.round((stats.totalCorrect / stats.totalAnswered) * 100) : 0;
  const ready = overallPct >= 82;

  const titleEl = document.getElementById("status-title");
  const infoEl = document.getElementById("status-info");
  if (stats.totalAnswered === 0) {
    titleEl.innerHTML = '<span style="color: var(--text-dim);">Awaiting first session...</span>';
    infoEl.textContent = "";
  } else if (ready) {
    titleEl.innerHTML = '<svg class="icon-lg" viewBox="0 0 24 24" style="color: var(--emerald);"><polyline points="20 6 9 17 4 12"/></svg><span style="color: var(--emerald);">EXAM_READY</span>';
    infoEl.textContent = `${stats.totalCorrect}/${stats.totalAnswered} correct · ${overallPct}% overall accuracy`;
  } else {
    titleEl.innerHTML = '<svg class="icon-lg" viewBox="0 0 24 24" style="color: var(--amber);"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span style="color: var(--amber);">TRAINING_IN_PROGRESS</span>';
    infoEl.textContent = `${stats.totalCorrect}/${stats.totalAnswered} correct · ${overallPct}% overall accuracy`;
  }

  // Domain breakdown
  const breakdownEl = document.getElementById("domain-breakdown");
  breakdownEl.innerHTML = Object.values(DOMAINS).map(d => {
    const ds = stats.byDomain[d.id];
    const pct = ds ? Math.round((ds.correct / ds.answered) * 100) : 0;
    return `
      <div class="domain-card">
        <div class="domain-card-header">
          <div class="domain-card-info">
            <svg class="domain-icon" viewBox="0 0 24 24" style="color: ${d.color};">${d.iconPath}</svg>
            <div>
              <div class="domain-name">${d.name}</div>
              <div class="domain-weight">${d.weight} of exam</div>
            </div>
          </div>
          <div>
            <div class="domain-pct" style="color: ${d.color};">${ds ? pct + "%" : "—"}</div>
            ${ds ? `<div class="domain-frac">${ds.correct}/${ds.answered}</div>` : ""}
          </div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%; background: ${d.color};"></div></div>
      </div>
    `;
  }).join("");

  document.getElementById("question-count-label").textContent = `${QUESTIONS.length} questions loaded`;
}

function renderMode() {
  // Domain tabs
  const dt = document.getElementById("domain-tabs");
  const allActive = configState.domain === "ALL" ? "active" : "";
  dt.innerHTML = `
    <button class="domain-tab ${allActive}" data-domain="ALL" style="${allActive ? `border-color: var(--cyan); color: var(--cyan);` : ""}">

  document.getElementById("count-section").classList.toggle("hidden", configState.mode === "exam");
