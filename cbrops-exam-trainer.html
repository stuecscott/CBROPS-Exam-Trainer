// ============================================================
// QUIZ
// ============================================================
function startQuiz() {
  const { mode, domain, count, weakOnly } = configState;
  let pool = domain === "ALL" ? [...QUESTIONS] : QUESTIONS.filter(q => q.domain === domain);

  if (weakOnly) {
    pool.sort((a, b) => {
      const aS = stats.byQuestion[a.id] || { c: 0, w: 0 };
      const bS = stats.byQuestion[b.id] || { c: 0, w: 0 };
      return (bS.w - bS.c) - (aS.w - aS.c);
    });
  } else {
    pool.sort(() => Math.random() - 0.5);
  }

  const finalCount = mode === "exam" ? Math.min(95, pool.length) : Math.min(count, pool.length);
  const questions = pool.slice(0, finalCount);

  session = {
    mode,
    questions,
    currentIdx: 0,
    answers: {},
    flagged: new Set(),
    startTime: Date.now(),
    timeLimit: mode === "exam" ? 120 * 60 * 1000 : null,
  };

  showView("quiz");
  renderQuiz();

  if (session.timeLimit) startTimer();
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const remaining = session.timeLimit - (Date.now() - session.startTime);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      finishQuiz();
      return;
    }
    const total = Math.floor(remaining / 1000);
    const m = Math.floor(total / 60).toString().padStart(2, "0");
    const s = (total % 60).toString().padStart(2, "0");
    const timerEl = document.getElementById("timer");
    document.getElementById("timer-text").textContent = `${m}:${s}`;
    timerEl.classList.toggle("warn", remaining < 10 * 60 * 1000);
  }, 1000);
}

function renderQuiz() {
  const q = session.questions[session.currentIdx];
  const domain = DOMAINS[q.domain];
  const userAnswer = session.answers[session.currentIdx];

  // Domain badge
  const badge = document.getElementById("domain-badge");
  badge.style.borderColor = domain.color;
  badge.style.color = domain.color;
  badge.innerHTML = `<svg class="icon" viewBox="0 0 24 24">${domain.iconPath}</svg>${domain.short.toUpperCase()}`;

  document.getElementById("q-counter").textContent = `Q${session.currentIdx + 1}/${session.questions.length}`;
  const answeredCount = Object.keys(session.answers).length;
  document.getElementById("answered-counter").textContent = `· Answered: ${answeredCount}`;
  const flaggedEl = document.getElementById("flagged-counter");
  if (session.flagged.size > 0) {
    flaggedEl.style.display = "";
    flaggedEl.textContent = `· Flagged: ${session.flagged.size}`;
  } else {
    flaggedEl.style.display = "none";
  }

  // Timer visibility
  document.getElementById("timer").classList.toggle("hidden", !session.timeLimit);

  // Progress bar
  const progress = ((session.currentIdx + 1) / session.questions.length) * 100;
  document.getElementById("progress-fill").style.width = progress + "%";

  // Question text
  document.getElementById("question-text").textContent = q.q;

  // Flag button
  const flagBtn = document.getElementById("flag-btn");
  flagBtn.classList.toggle("flagged", session.flagged.has(session.currentIdx));

  // Choices
  const choicesEl = document.getElementById("choices");
  const showFeedback = session.mode === "study" && userAnswer !== undefined;
  choicesEl.innerHTML = q.choices.map((c, idx) => {
    const isSelected = userAnswer === idx;
    const isCorrect = idx === q.a;
    let cls = "choice";
    if (showFeedback && isSelected && isCorrect) cls += " correct";
    else if (showFeedback && isSelected && !isCorrect) cls += " incorrect";
    else if (showFeedback && isCorrect) cls += " reveal-correct";
    else if (isSelected) cls += " selected";
    if (showFeedback) cls += " locked";

    let icon = "";
    if (showFeedback && isCorrect) icon = '<svg class="choice-icon" viewBox="0 0 24 24" style="color: var(--emerald);"><polyline points="20 6 9 17 4 12"/></svg>';
    else if (showFeedback && isSelected && !isCorrect) icon = '<svg class="choice-icon" viewBox="0 0 24 24" style="color: var(--red);"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

    return `<button class="${cls}" data-choice="${idx}" ${showFeedback ? "disabled" : ""}>
      <div class="choice-letter">${String.fromCharCode(65 + idx)}</div>
      <div class="choice-text">${escapeHtml(c)}</div>
      ${icon}
    </button>`;
  }).join("");

  // Feedback panel
  const fb = document.getElementById("feedback");
  if (showFeedback) {
    const correct = userAnswer === q.a;
    fb.className = "feedback " + (correct ? "correct" : "incorrect");
    fb.innerHTML = `
      <div class="feedback-label">${correct ? "✓ CORRECT" : "✗ INCORRECT"}</div>
      <div class="feedback-text">${escapeHtml(q.exp)}</div>
    `;
    fb.classList.remove("hidden");
  } else {
    fb.classList.add("hidden");
  }

  // Nav buttons
  document.getElementById("prev-btn").disabled = session.currentIdx === 0;
  document.getElementById("nav-counter").textContent = `${answeredCount}/${session.questions.length}`;
  const nextBtn = document.getElementById("next-btn");
  if (session.currentIdx === session.questions.length - 1) {
    nextBtn.textContent = "SUBMIT EXAM";
    nextBtn.className = "btn-submit";
  } else {
    nextBtn.textContent = "NEXT →";
    nextBtn.className = "btn-next";
  }

  // Quick nav (exam only)
  const qnSection = document.getElementById("quick-nav-section");
  if (session.mode === "exam") {
    qnSection.classList.remove("hidden");
    const grid = document.getElementById("quick-nav-grid");
    grid.innerHTML = session.questions.map((_, i) => {
      let cls = "quick-nav-btn";
      if (i === session.currentIdx) cls += " current";
      else if (session.flagged.has(i)) cls += " flagged";
      else if (session.answers[i] !== undefined) cls += " answered";
      return `<button class="${cls}" data-jump="${i}">${i + 1}</button>`;
    }).join("");
  } else {
    qnSection.classList.add("hidden");
  }
}

function answerQuestion(idx) {
  const q = session.questions[session.currentIdx];
  if (session.mode === "study" && session.answers[session.currentIdx] !== undefined) return;
  session.answers[session.currentIdx] = idx;
  renderQuiz();
}

function nextQuestion() {
  if (session.currentIdx === session.questions.length - 1) {
    finishQuiz();
  } else {
    session.currentIdx++;
    renderQuiz();
  }
}

function prevQuestion() {
  if (session.currentIdx > 0) {
    session.currentIdx--;
    renderQuiz();
  }
}

function jumpToQuestion(idx) {
  session.currentIdx = idx;
  renderQuiz();
}

function toggleFlag() {
  if (session.flagged.has(session.currentIdx)) session.flagged.delete(session.currentIdx);
  else session.flagged.add(session.currentIdx);
  renderQuiz();
}

// ============================================================
// FINISH & RESULTS
// ============================================================
function finishQuiz() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  const { questions, answers } = session;
  let correct = 0;
  questions.forEach((q, i) => {
    const ans = answers[i];
    const isCorrect = ans === q.a;
    if (isCorrect) correct++;
    stats.byDomain[q.domain] = stats.byDomain[q.domain] || { answered: 0, correct: 0 };
    stats.byDomain[q.domain].answered++;
    if (isCorrect) stats.byDomain[q.domain].correct++;
    stats.byQuestion[q.id] = stats.byQuestion[q.id] || { c: 0, w: 0 };
    if (isCorrect) stats.byQuestion[q.id].c++;
    else if (ans !== undefined) stats.byQuestion[q.id].w++;
  });

  stats.totalAnswered += questions.length;
  stats.totalCorrect += correct;

  const sessionRecord = {
    date: new Date().toISOString(),
    mode: session.mode,
    total: questions.length,
    correct,
    score: Math.round((correct / questions.length) * 100),
    duration: Math.round((Date.now() - session.startTime) / 1000),
  };
  stats.sessions = [sessionRecord, ...stats.sessions].slice(0, 50);
  saveStats();

  session.correct = correct;
  session.finished = true;
  renderResults();
  showView("results");
}

function renderResults() {
  const { questions, answers, correct, mode } = session;
  const score = Math.round((correct / questions.length) * 100);
  const passed = score >= 82;
  const duration = Math.round((Date.now() - session.startTime) / 1000);

  // Score banner
  const banner = document.getElementById("score-banner");
  banner.className = "score-banner " + (passed ? "passed" : "failed");
  document.getElementById("score-label").textContent = passed ? "// EXAM_READY_STATUS_ACHIEVED" : "// CONTINUE_TRAINING";
  const iconEl = document.getElementById("score-icon");
  iconEl.innerHTML = passed
    ? '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
    : '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>';
  document.getElementById("score-num").textContent = score;
  document.getElementById("score-fraction").textContent = `${correct}/${questions.length} correct`;
  const m = Math.floor(duration / 60), s = duration % 60;
  document.getElementById("score-meta").textContent = `Duration: ${m}m ${s}s · ${mode.toUpperCase()} mode`;
  if (mode === "exam") {
    document.getElementById("score-note").textContent = `CBROPS pass mark is approximately 82%. ${passed ? "You're tracking on target!" : "Keep practicing — target is 82%+."}`;
  } else {
    document.getElementById("score-note").textContent = "";
  }

  // Domain results
  const byDomain = {};
  questions.forEach((q, i) => {
    byDomain[q.domain] = byDomain[q.domain] || { total: 0, correct: 0 };
    byDomain[q.domain].total++;
    if (answers[i] === q.a) byDomain[q.domain].correct++;
  });
  document.getElementById("domain-results").innerHTML = Object.entries(byDomain).map(([id, d]) => {
    const dom = DOMAINS[id];
    const pct = Math.round((d.correct / d.total) * 100);
    return `
      <div class="domain-card">
        <div class="domain-card-header">
          <div class="domain-card-info">
            <svg class="domain-icon" viewBox="0 0 24 24" style="color: ${dom.color};">${dom.iconPath}</svg>
            <div class="domain-name">${dom.name}</div>
          </div>
          <div class="domain-pct" style="color: ${dom.color};">${pct}%</div>
        </div>
        <div class="domain-frac" style="text-align: left; margin-bottom: 0.5rem;">${d.correct} of ${d.total} correct</div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%; background: ${dom.color};"></div></div>
      </div>
    `;
  }).join("");

  // Review wrong
  const wrong = questions.map((q, i) => ({ ...q, idx: i, userAnswer: answers[i] })).filter(q => q.userAnswer !== q.a);
  const reviewSection = document.getElementById("review-section");
  if (wrong.length > 0) {
    reviewSection.classList.remove("hidden");
    document.getElementById("review-label").textContent = `// REVIEW_INCORRECT [${wrong.length}]`;
    document.getElementById("review-list").innerHTML = wrong.slice(0, 30).map(q => {
      const dom = DOMAINS[q.domain];
      const userAnsHtml = q.userAnswer !== undefined
        ? `<div class="your-ans"><span class="ans-label">Your answer:</span> ${String.fromCharCode(65 + q.userAnswer)}. ${escapeHtml(q.choices[q.userAnswer])}</div>`
        : '<div class="your-ans"><span class="ans-label">Your answer:</span> (skipped)</div>';
      return `
        <details class="review-item">
          <summary class="review-summary">
            <span class="review-badge" style="color: ${dom.color}; border-color: ${dom.color};">${dom.short.toUpperCase()}</span>
            ${escapeHtml(q.q)}
          </summary>
          <div class="review-body">
            ${userAnsHtml}
            <div class="correct-ans"><span class="ans-label">Correct:</span> ${String.fromCharCode(65 + q.a)}. ${escapeHtml(q.choices[q.a])}</div>
            <div class="explanation">${escapeHtml(q.exp)}</div>
          </div>
        </details>
      `;
    }).join("") + (wrong.length > 30 ? `<div style="text-align: center; font-size: 0.7rem; color: var(--text-muted); margin-top: 0.5rem;">+ ${wrong.length - 30} more incorrect</div>` : "");
  } else {
    reviewSection.classList.add("hidden");
  }
}

// ============================================================
// STATS VIEW
// ============================================================
function renderStats() {
  const overallPct = stats.totalAnswered > 0 ? Math.round((stats.totalCorrect / stats.totalAnswered) * 100) : 0;

  document.getElementById("stat-overview").innerHTML = `
    <div class="stat-card"><div class="stat-card-label">Sessions</div><div class="stat-card-value" style="color: var(--cyan);">${stats.sessions.length}</div></div>
    <div class="stat-card"><div class="stat-card-label">Total Answered</div><div class="stat-card-value" style="color: var(--purple);">${stats.totalAnswered}</div></div>
    <div class="stat-card"><div class="stat-card-label">Correct</div><div class="stat-card-value" style="color: var(--emerald);">${stats.totalCorrect}</div></div>
    <div class="stat-card"><div class="stat-card-label">Overall Accuracy</div><div class="stat-card-value" style="color: ${overallPct >= 82 ? "var(--emerald)" : "var(--amber)"};">${overallPct}%</div></div>
  `;

  document.getElementById("stats-domains").innerHTML = Object.values(DOMAINS).map(d => {
    const ds = stats.byDomain[d.id];
    const pct = ds ? Math.round((ds.correct / ds.answered) * 100) : 0;
    return `
      <div class="domain-card">
        <div class="domain-card-header">
          <div class="domain-card-info">
            <svg class="domain-icon" viewBox="0 0 24 24" style="color: ${d.color};">${d.iconPath}</svg>
            <span class="domain-name">${d.name}</span>
            <span class="domain-weight">(${d.weight})</span>
          </div>
          <div>
            <span style="color: ${d.color}; font-weight: 700;">${ds ? pct + "%" : "—"}</span>
            ${ds ? `<span style="color: var(--text-muted); font-size: 0.7rem; margin-left: 0.5rem;">${ds.correct}/${ds.answered}</span>` : ""}
          </div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%; background: ${d.color};"></div></div>
      </div>
    `;
  }).join("");

  const sessionsWrap = document.getElementById("stats-sessions-wrap");
  if (stats.sessions.length > 0) {
    sessionsWrap.classList.remove("hidden");
    const tableEl = document.getElementById("stats-sessions");
    tableEl.innerHTML = `
      <div class="session-row header">
        <div>DATE</div><div>MODE</div><div>QUESTIONS</div><div>SCORE</div><div>DURATION</div>
      </div>
      ${stats.sessions.slice(0, 15).map(s => {
        const d = new Date(s.date);
        const dateStr = `${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
        const scoreCls = s.score >= 82 ? "high" : s.score >= 60 ? "mid" : "low";
        return `
          <div class="session-row data">
            <div style="color: var(--text-dim);">${dateStr}</div>
            <div class="session-mode" style="color: var(--text);">${s.mode}</div>
            <div style="color: var(--text);">${s.correct}/${s.total}</div>
            <div class="session-score ${scoreCls}">${s.score}%</div>
            <div style="color: var(--text-muted);">${Math.floor(s.duration / 60)}m ${s.duration % 60}s</div>
          </div>
        `;
      }).join("")}
    `;
  } else {
    sessionsWrap.classList.add("hidden");
  }

  // Reset section
  const resetSection = document.getElementById("reset-section");
  resetSection.innerHTML = `
    <button class="btn btn-danger" id="reset-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" style="display: inline; vertical-align: middle; margin-right: 4px;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      RESET ALL PROGRESS
    </button>
  `;
  document.getElementById("reset-btn").addEventListener("click", showResetConfirm);
}

function showResetConfirm() {
  const resetSection = document.getElementById("reset-section");
  resetSection.innerHTML = `
    <div class="reset-confirm-row">
      <span class="warning">Erase all stats?</span>
      <button class="btn btn-confirm" id="confirm-reset-btn">CONFIRM</button>
      <button class="btn" id="cancel-reset-btn">CANCEL</button>
    </div>
  `;
  document.getElementById("confirm-reset-btn").addEventListener("click", () => {
    stats = { ...DEFAULT_STATS };
    saveStats();
    renderStats();
  });
  document.getElementById("cancel-reset-btn").addEventListener("click", renderStats);
}

// ============================================================
// HELPERS
// ============================================================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ============================================================
// EVENT LISTENERS
// ============================================================
document.getElementById("back-btn").addEventListener("click", () => {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  showView("home");
});

document.getElementById("analytics-btn").addEventListener("click", () => showView("stats"));

document.querySelectorAll(".mode-card").forEach(card => {
  card.addEventListener("click", () => {
    configState.mode = card.dataset.action;
    renderMode();
    showView("mode");
  });
});

// Mode tabs
document.querySelectorAll(".mode-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    configState.mode = btn.dataset.mode;
    renderMode();
  });
});

// Domain tabs (delegated)
document.getElementById("domain-tabs").addEventListener("click", e => {
  const btn = e.target.closest(".domain-tab");
  if (!btn) return;
  configState.domain = btn.dataset.domain;
  renderMode();
});

// Count tabs
document.querySelectorAll(".count-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    configState.count = parseInt(btn.dataset.count);
    renderMode();
  });
});

document.getElementById("weak-checkbox").addEventListener("change", e => {
  configState.weakOnly = e.target.checked;
});

document.getElementById("start-btn").addEventListener("click", startQuiz);

// Quiz interactions (delegated)
document.getElementById("choices").addEventListener("click", e => {
  const btn = e.target.closest(".choice");
  if (!btn) return;
  answerQuestion(parseInt(btn.dataset.choice));
});

document.getElementById("flag-btn").addEventListener("click", toggleFlag);
document.getElementById("prev-btn").addEventListener("click", prevQuestion);
document.getElementById("next-btn").addEventListener("click", nextQuestion);

document.getElementById("quick-nav-grid").addEventListener("click", e => {
  const btn = e.target.closest(".quick-nav-btn");
  if (!btn) return;
  jumpToQuestion(parseInt(btn.dataset.jump));
});

document.getElementById("results-home").addEventListener("click", () => showView("home"));
document.getElementById("results-retry").addEventListener("click", () => {
  configState.weakOnly = true;
  configState.domain = "ALL";
  configState.count = session.questions.length;
  configState.mode = session.mode;
  startQuiz();
});

// ============================================================
// BOOT
// ============================================================
showView("home");
</script>
</body>
</html>
